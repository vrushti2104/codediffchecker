name: codediff 
recipe: laravel
config:
  php: '8.4'
  composer_version: '2.0.7'
  via: apache:2.4
  webroot: public
  database: mysql:8.0
  cache: none
  xdebug: false
  
services:

  appserver:
    build_as_root:
      - apt-get update -y && apt-get install -y --no-install-recommends poppler-utils antiword && rm -rf /var/lib/apt/lists/*

  pma:
    type: phpmyadmin
    hosts:
     - database
